<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Upload Calendar | PickMyActivities</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.5;
      max-width: 650px;
      margin: 30px auto;
      padding: 0 20px;
      color: #222;
    }
    h1 { color: #234d68; }
    label {
      display: block;
      font-weight: bold;
      margin-top: 22px;
    }
    input, button {
      font: inherit;
      margin-top: 8px;
    }
    input[type="month"],
    input[type="file"] {
      display: block;
      max-width: 100%;
      box-sizing: border-box;
    }
    button {
      padding: 12px 20px;
      background: #234d68;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled {
      background: #777;
      cursor: not-allowed;
    }
    .note {
      background: #f0f4f6;
      padding: 14px;
      border-radius: 6px;
    }
    #message { margin-top: 20px; }
    [hidden] {
  display: none !important;
}
  </style>
</head>
<body>
  <h1>Upload Monthly Calendar</h1>

  <p class="note">
    Select the month and choose a calendar
    photograph or PDF. Calendars must be
    reviewed before they are published.
  </p>

    <form id="uploadForm" hidden>
    <label for="calendarMonth">
      Calendar month
    </label>he
    <input
      id="calendarMonth"
      type="month"
      required
    >

    <label for="calendarFile">
      Calendar file
    </label>
    <input
      id="calendarFile"
      type="file"
      accept=".pdf,.jpg,.jpeg,.png,.heic,.heif,application/pdf,image/jpeg,image/png,image/heic,image/heif"
      required
    >

    <button
  id="uploadButton"
  type="submit">
  Upload Calendar
</button>
  <button
  id="testExtractionButton"
  type="button"
  hidden>
  Test Administrator Connection
</button>
      
  </form>

  <p id="message" role="status"
   aria-live="polite">
  Checking administrator access...
</p>

  <section id="calendarReview">
  <h2>Review Calendar Activities</h2>
  <p>
    Review all activities for each day
    before approving the calendar.
  </p>
<div id="reviewDay">
<h3 id="reviewDate">October 1, 2026</h3>
<ul id="reviewActivities">  
 </ul>
    <button id="approveDayButton" type="button">
  Approve October 1
</button>
<button id="nextDayButton" type="button">
  Next Day →
</button>
  <p id="dayApprovalStatus" role="status"></p>
</div>
    </section>
  
    <script type="module">
  import { createClient } from
    "https://esm.sh/@supabase/supabase-js@2";

  const supabaseUrl =
    "https://atzbisporfxvwqqrthje.supabase.co";

  const supabaseKey =
    "sb_publishable__P_r4py9kqhEigCBUQXMkw_v6RzZ2VJ";

  const supabase = createClient(
    supabaseUrl,
    supabaseKey
  );
    
  const allowedExtensions = [
    "pdf", "jpg", "jpeg", "png", "heic", "heif"
  ];

  const maximumFileSize = 10 * 1024 * 1024;

  function validateCalendarFile(file) {
    if (!file) {
      return "Please select a calendar file.";
    }

    const extension = file.name
      .split(".")
      .pop()
      .toLowerCase();

    if (!allowedExtensions.includes(extension)) {
      return "Please choose a PDF or supported photograph.";
    }

    if (file.size > maximumFileSize) {
      return "The file must be 10 MB or smaller.";
    }

    if (file.size === 0) {
      return "The selected file is empty.";
    }

    return null;
  }
      
  const uploadForm =
    document.getElementById("uploadForm");
const uploadButton =
  document.getElementById("uploadButton");

  const message =
    document.getElementById("message");

  async function checkAdministratorAccess() {
    const { data: userData, error: userError } =
      await supabase.auth.getUser();
   

  document.getElementById("approveDayButton")
  .addEventListener("click", function() {
    document.getElementById("dayApprovalStatus")
      .textContent = "October 1 review confirmed (test only).";
  });

    if (userError || !userData.user) {
      message.textContent =
        "Please sign in as an administrator first.";
      return;
    }

    const { data: administrator, error: adminError } =
      await supabase
        .from("admin_users")
        .select("admin_role")
        .eq("community_id", 1)
        .eq("user_id", userData.user.id)
        .maybeSingle();

    if (adminError || !administrator) {
      message.textContent =
        "Access denied. This account is not an authorized administrator.";
      return;
    }

    uploadForm.hidden = false;
    message.textContent =
      "Administrator verified. You may select a calendar.";
    document.getElementById("testExtractionButton").hidden = false;
  }

  checkAdministratorAccess();

let currentReviewDay = 1;
      
document.getElementById("nextDayButton")
  .addEventListener("click", function() {
    const dayText = getCalendarDay(2);

    if (!dayText) {
      alert("October 2 activities are not available yet.");
      return;
    }

    document.getElementById("reviewDate")
      .textContent = "October 2, 2026";

const activityLines = dayText
  .split("\n")
  .slice(1)
  .map(line => line.trim())
  .filter(line => line.startsWith("-"));

const activityList =
  document.getElementById("reviewActivities");

activityList.replaceChildren();

activityLines.forEach(line => {
  const item = document.createElement("li");
  item.textContent = line.replace(/^-\s*/, "");
  item.style.padding = "8px 0";
  item.style.borderBottom = "1px solid #ddd";
  activityList.appendChild(item);
});;
  });
      let savedCalendarText = "";
      
      async function loadSavedCalendar() {
  const { data, error } = await supabase
    .from("calendar_imports")
    .select("extracted_text")
    .eq("import_id", 16)
    .eq("community_id", 1)
    .single();

  if (error) {
    console.error("Could not load saved calendar:", error);
    return;
  }

  if (data?.extracted_text) {
    savedCalendarText = data.extracted_text;
    const octoberFirst = getCalendarDay(1);

console.log(
  "October 1 loaded from Supabase:",
  octoberFirst
);
    console.log(
      "Saved October calendar loaded:",
      data.extracted_text.length,
      "characters"
    );
  }
}
const activityLines = octoberFirst
  .split("\n")
  .slice(1)
  .map(line => line.trim())
  .filter(line => line.startsWith("-"));

const activityList =
  document.getElementById("reviewActivities");

activityList.replaceChildren();

activityLines.forEach(line => {
  const item = document.createElement("li");
  item.textContent = line.replace(/^-\s*/, "");
  item.style.padding = "8px 0";
  item.style.borderBottom = "1px solid #ddd";
  activityList.appendChild(item);
});
      
      
      function getCalendarDay(dayNumber) {
  if (!savedCalendarText) {
    return "";
  }

  const dayPattern =
    /^October\s+(\d{1,2}),\s+2026\b.*$/gm;

  const matches = [...savedCalendarText.matchAll(dayPattern)];

  const currentIndex = matches.findIndex(
    match => Number(match[1]) === dayNumber
  );

  if (currentIndex === -1) {
    return "";
  }

  const start = matches[currentIndex].index;
  const end = matches[currentIndex + 1]
    ? matches[currentIndex + 1].index
    : savedCalendarText.length;

  return savedCalendarText.slice(start, end).trim();
}

      loadSavedCalendar();
      window.testCalendarDay = getCalendarDay;

      
    document.getElementById("testExtractionButton")
  .addEventListener("click", async function() {
    const button = this;
    button.disabled = true;
    message.textContent =
      "Testing administrator connection...";

    try {
      const { data, error } =
        await supabase.functions.invoke(
          "extract-calendar",
          
          { body: {} }
        );

      if (error) {
        throw error;
      }
message.style.whiteSpace = "pre-wrap";
console.log("Calendar extraction diagnostics:", {
  extracted_length: data.extracted_length,
  response_status: data.response_status,
  output_items: data.output_items
});
      message.textContent =
(data.message || "Connection successful.") +
(data.extracted_text
  ? "\n\nEXTRACTED CALENDAR ACTIVITIES:\n\n" +
    data.extracted_text
  : "");
      
    } catch (error) {
      message.textContent =
        "Connection test failed: " + error.message;

    } finally {
      button.disabled = false;
    }
  });
      
document.getElementById("uploadForm")
  .addEventListener("submit", async function(event) {
    event.preventDefault();

    const month =
      document.getElementById("calendarMonth").value;

    const file =
      document.getElementById("calendarFile").files[0];

    const validationError = validateCalendarFile(file);

    if (validationError) {
      message.textContent = validationError;
      return;
    }

    if (uploadButton.disabled) {
      return;
    }

    uploadButton.disabled = true;
    message.textContent = "Uploading calendar...";

    try {
      const fileExtension = file.name
        .split(".")
        .pop()
        .toLowerCase();

      const uniqueFileName =
        crypto.randomUUID() + "." + fileExtension;

      const storagePath =
        "community-1/" + month + "/" + uniqueFileName;

      const { error: uploadError } =
        await supabase.storage
          .from("calendar-originals")
          .upload(storagePath, file, {
            upsert: false
          });

      if (uploadError) {
        throw uploadError;
      }
      const { data: userData, error: userError } =
  await supabase.auth.getUser();

if (userError || !userData.user) {
  throw new Error(
    "Your login session has expired."
  );
}

const { error: recordError } =
  await supabase
    .from("calendar_imports")
    .insert({
      community_id: 1,
      calendar_month: month + "-01",
      original_filename: file.name,
      storage_path: storagePath,
      status: "uploaded",
      uploaded_by: userData.user.id
    });

if (recordError) {
  throw new Error(
    "File saved, but calendar record failed: " +
    recordError.message
  );
}

      message.textContent =
        "Calendar file uploaded successfully. " +
        "It has not been published.";

    } catch (error) {
      message.textContent =
        "Upload failed: " + error.message;

    } finally {
      uploadButton.disabled = false;
    }
  });
  </script>
</body>
</html>
