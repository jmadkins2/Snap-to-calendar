  function validateCalendarFile(file) {
    if (!file) {
      return "Please select a calendar file.";
    }

    const extension = file.name
      .split(".")
      .pop()
      .toLowerCase();

    if (!allowedExtensions.includes(extension)) {
      return "Please choose a PDF or supported photograph.";
    }

    if (file.size > maximumFileSize) {
      return "The file must be 10 MB or smaller.";
    }

    if (file.size === 0) {
      return "The selected file is empty.";
    }

    return null;
  }

      let savedCalendarText = "";

      let approvedDays = new Set();function updateApprovalProgress() {
  if (!savedCalendarMonth) return;

  const [year, month] = savedCalendarMonth.split("-").map(Number);
  const daysInMonth = new Date(year, month, 0).getDate();

  document.getElementById("approvalProgress").textContent =
    approvedDays.size + " of " + daysInMonth + " days approved";

function findNextUnapprovedDay() {
  if (!savedCalendarMonth) return null;

  const [year, month] = savedCalendarMonth.split("-").map(Number);
  const daysInMonth = new Date(year, month, 0).getDate();

  for (let day = currentReviewDay + 1; day <= daysInMonth; day++) {
    const date =
      year + "-" +
      String(month).padStart(2, "0") + "-" +
      String(day).padStart(2, "0");

    if (!approvedDays.has(date)) {
      return day;
    }
  }

  return null;
}
      

      function isCurrentDayApproved() {
  const [year, month] = savedCalendarMonth.split("-").map(Number);

  const date =
    year + "-" +
    String(month).padStart(2, "0") + "-" +
    String(currentReviewDay).padStart(2, "0");

  return approvedDays.has(date);
}

      async function loadApprovedDays() {

  function getCalendarDay(dayNumber) {
  if (!savedCalendarText) {
    return "";
  }

  const dayPattern =
    /^October\s+(\d{1,2}),\s+2026\b.*$/gm;

  const matches = [...savedCalendarText.matchAll(dayPattern)];

  const currentIndex = matches.findIndex(
    match => Number(match[1]) === dayNumber
  );

  if (currentIndex === -1) {
    return "";
  }

  const start = matches[currentIndex].index;
  const end = matches[currentIndex + 1]
    ? matches[currentIndex + 1].index
    : savedCalendarText.length;

return savedCalendarText
  .slice(start, end)
  .split("\n---")[0]
  .trim();
      }
