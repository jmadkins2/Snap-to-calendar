<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>PickMyActivities — Administrator Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      background: #f5f7fa;
      color: #202936;
      margin: 0;
      padding: 24px;
    }
    main {
      max-width: 480px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border: 1px solid #d5dce5;
      border-radius: 12px;
    }
    h1 { font-size: 28px; }
    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 2px solid #697586;
      border-radius: 6px;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      font-size: 19px;
      font-weight: bold;
      color: white;
      background: #175c91;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #e6a23c;
      outline-offset: 3px;
    }
    #message {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main>
    <h1>PickMyActivities</h1>
    <h2>Administrator Login</h2>
    <p>Sign in to manage community activities.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" type="email"
             autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button type="submit">Sign In</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>


<script type="module">
  import { createClient } from
    "https://esm.sh/@supabase/supabase-js@2";

  // Copy these two values from Supabase-testing.html
  const SUPABASE_URL = "https://atzbisporfxvwqqrthje.supabase.co"
  const SUPABASE_KEY = "sb_publishable__P_r4py9kqhEigCBUQXMkw_v6RzZ2VJ";

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");
  const button = form.querySelector("button");

  
  // Check for an existing administrator session
  async function checkExistingSession() {
    const { data, error } = await supabase.auth.getUser();

    if (error || !data.user) {
      return;
    }

    const { data: membership, error: roleError } =
      await supabase
        .from("admin_users")
        .select("admin_role")
        .eq("community_id", 1)
        .eq("user_id", data.user.id)
        .single();

    if (roleError || !membership) {
      await supabase.auth.signOut();
      return;
    }

    form.hidden = true;

    message.textContent =
      "Login successful! Your role is: " +
      membership.admin_role;

    // Don't create another Sign Out button
    if (document.getElementById("signOutButton")) {
      return;
    }

    const signOutButton = document.createElement("button");
    signOutButton.type = "button";
    signOutButton.textContent = "Sign Out";
    signOutButton.id = "signOutButton";

    message.insertAdjacentElement(
      "afterend",
      signOutButton
    );

    signOutButton.addEventListener("click", async () => {
      const { error } = await supabase.auth.signOut();

      if (error) {
        message.textContent =
          "Sign out failed. Please try again.";
        return;
      }

      signOutButton.remove();
      form.reset();
      form.hidden = false;
      message.textContent =
        "You have signed out successfully.";
    });
  }

  checkExistingSession();

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    message.textContent = "Signing in...";
    button.disabled = true;

    try {
      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const { data, error } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      if (error) throw error;

      const { data: membership, error: roleError } =
        await supabase
          .from("admin_users")
          .select("admin_role")
          .eq("community_id", 1)
          .eq("user_id", data.user.id)
          .single();

      if (roleError || !membership) {
        await supabase.auth.signOut();
        message.textContent =
          "This account is not authorized to manage activities.";
        return;
      }

      message.textContent =
        "Login successful! Your role is: " +
        membership.admin_role;

    
    form.hidden = true;

      const signOutButton = document.createElement("button");
      signOutButton.type = "button";
      signOutButton.textContent = "Sign Out";
      signOutButton.id = "signOutButton";

      message.insertAdjacentElement(
        "afterend",
        signOutButton
      );

      signOutButton.addEventListener("click", async () => {
        const { error } = await supabase.auth.signOut();

        if (error) {
          message.textContent = "Sign out failed. Please try again.";
          return;
        }

        signOutButton.remove();
        form.reset();
        form.hidden = false;
        message.textContent = "You have signed out successfully.";
      });
    
    } catch (error) {
      message.textContent =
        "Sign in failed. Please check your email and password.";
      console.error("Login error:", error.message);
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
